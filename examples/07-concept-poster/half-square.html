<!-- 方图：同一个想法重新构图，1 和 2 缩到左右两边，信息只留日期 -->
<style>
 .half{position:absolute;inset:0;background:var(--accent)}
 .half .big{position:absolute;font-size:calc(var(--u) * 58);line-height:1;color:var(--bg)}
 .half .slash{position:absolute;left:calc(var(--u)*18);top:calc(var(--u)*50);width:calc(var(--u)*70);height:calc(var(--u)*4);background:var(--ink);transform:rotate(-42deg);transform-origin:left center}
</style>
<div class="half">
 <div class="f-dyh" data-field="kicker" data-c="ink" data-on="accent" data-role="label"
      style="position:absolute;left:var(--safe);top:var(--safe);font-size:calc(var(--u)*5)"></div>
 <div class="big f-dyh" data-art="1" style="left:calc(var(--u)*6);top:calc(var(--u)*10)">1</div>
 <div class="slash"></div>
 <div class="big f-dyh" data-art="1" style="right:calc(var(--u)*6);top:calc(var(--u)*36)">2</div>
 <div class="f-dyh" data-field="headline" data-c="ink" data-on="accent"
      style="position:absolute;left:var(--safe);bottom:calc(var(--safe) + var(--u)*7);font-size:calc(var(--u)*12.5);line-height:1.02;white-space:pre-line"></div>
 <div data-field="details.0.v" data-c="ink" data-on="accent"
      style="position:absolute;left:var(--safe);bottom:var(--safe);font-size:calc(var(--u)*3.4);font-weight:700"></div>
</div>
